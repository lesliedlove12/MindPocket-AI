workflows:
  ios-workflow:
    name: MindPocket iOS
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mindpocket.ai
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios

    artifacts:
      - build/ios/ipa/*.ipa